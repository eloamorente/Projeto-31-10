<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Player Simples</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<main class="container">
			<h1>Player de Músicas</h1>

			<section class="controls">
				<input id="fileInput" type="file" accept="audio/*" multiple />
				<div class="player">
					<button id="prevBtn" title="Anterior">⏮</button>
					<button id="playBtn" title="Play/Pause">▶️</button>
					<button id="nextBtn" title="Próxima">⏭</button>
					<div class="progress-wrap">
						<input id="progress" type="range" min="0" max="100" value="0">
						<div id="time">00:00 / 00:00</div>
					</div>
				</div>
			</section>

			<section>
				<ul id="trackList" class="track-list"></ul>
			</section>

			<audio id="audio" preload="metadata"></audio>
		</main>

		<script src="app.js"></script>
	</body>
</html>
